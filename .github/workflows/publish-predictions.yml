name: Generate daily Apes Nation football predictions
on:
  schedule:
    # 05:17 UTC = 07:17 South African time (actual execution may vary).
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apes-nation-daily-publisher
  cancel-in-progress: false
jobs:
  publish-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test forecast, squad research and owner-access setup
        run: python -m unittest -q test_auto_predict.py test_squad_intel.py test_membership_security.py
      - name: Generate predictions and settle matches using API-Football
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_API_CALLS: '85'
        run: python auto_predict.py
      - name: Evaluate model with historical results (no extra API calls)
        run: python backtest.py
      - name: Save changes to GitHub for connected Netlify deployment
        run: |
          git config user.name 'apes-nation-automation'
          git config user.email 'apes-nation-automation@users.noreply.github.com'
          git add data.js history.json archive_history.json backtest_data.js cache/match_stats.json cache/squad_intel.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Apes Nation predictions and results'
            git push
          fi
